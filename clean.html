<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORION</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#050504;color:#eee;font:15px system-ui}.wrap{max-width:900px;margin:auto;padding:22px}.card{background:#0b0b09;border:1px solid #292416;border-radius:18px;padding:22px}.login{max-width:420px;margin:12vh auto}.field{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;background:#070705;color:#eee;border:1px solid #292416;border-radius:12px}.btn{border:1px solid #584719;background:#151207;color:#e6b84a;border-radius:12px;padding:12px 16px;font-weight:700}.wide{width:100%;margin-top:8px}.hidden{display:none}.muted{color:#928a78;font-size:12px}.command{display:flex;gap:8px;margin-top:20px}.command input{flex:1;padding:14px;background:#090907;color:#eee;border:1px solid #292416;border-radius:12px}.feed{margin-top:15px;display:grid;gap:8px}.msg{padding:11px;border:1px solid #211d13;border-radius:12px;background:#090907}.meta{font-size:9px;color:#928a78;letter-spacing:.12em;margin-bottom:3px}.tools{display:flex;gap:8px;margin-top:10px}header{display:flex;justify-content:space-between}.online{color:#79d7a5;font-size:10px}.core{text-align:center;padding:60px;color:#e6b84a}</style></head><body><div id="login" class="wrap"><div class="card login"><b>ORION</b><p class="muted">Personal AI operating system</p><input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Password"><button id="signin" class="btn wide">SIGN IN</button><div id="authmsg" class="muted"></div></div></div><div id="app" class="wrap hidden"><header><b>ORION</b><span class="online">● ONLINE</span></header><div class="core" id="state">CORE READY</div><div class="command"><input id="command" placeholder="Ask Orion anything..."><button id="run" class="btn">EXECUTE</button></div><div class="tools"><button id="mic" class="btn">MIC</button><button id="speak" class="btn">SPEAK LAST</button><span id="voice" class="muted">VOICE READY</span></div><div id="feed" class="feed"></div></div><script>
(()=>{const U=String.fromCharCode(...[104,116,116,112,115,58,47,47,98,104,103,110,122,100,116,106,97,112,100,110,119,114,121,98,116,108,113,46,115,117,112,97,98,97,115,101,46,99,111,109]),K="sb_publishable_"+String.fromCharCode(71,116,84,87,82,48,105,52,102,110,113,49,50,69,103,115,110,71,121,81,95,101,121,72,115,100,84,54,97),S="orion-auth-v3";let c,busy=false,last="";const $=id=>document.getElementById(id),add=(r,t)=>{let e=document.createElement("div"),m=document.createElement("div"),b=document.createElement("div");e.className="msg";m.className="meta";m.textContent=r;b.textContent=t;e.append(m,b);$("feed").prepend(e)},state=t=>$("state").textContent=t,voice=t=>$("voice").textContent=t;async function cli(){if(c)return c;if(!window.supabase?.createClient)throw Error("Supabase library failed");c=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:localStorage,storageKey:S}});return c}async function sess(){let r=await(await cli()).auth.getSession();if(r.error)throw r.error;if(!r.data.session)throw Error("No active session. Sign in again.");return r.data.session}function show(){$("login").classList.add("hidden");$("app").classList.remove("hidden")}async function brain(q){let s=await sess(),r=await fetch(U+"/functions/v1/orion-brain",{method:"POST",headers:{"Content-Type":"application/json","apikey":K,"Authorization":"Bearer "+s.access_token},body:JSON.stringify({command:q,context:{currentTime:{iso:new Date().toISOString()},activeConversation:{currentUserMessage:q,followUpContext:true},memories:[],goals:[],tasks:[],projects:[],missions:[],agentEvents:[],missionRuns:[],capabilityRequests:[],recentMessages:[],recentRecommendations:[],recentChallenges:[]}})}),raw=await r.text(),j=null;try{j=JSON.parse(raw)}catch{}if(!r.ok)throw Error("Brain HTTP "+r.status+": "+(j?.error||j?.message||raw||r.statusText));if(!j?.ok)throw Error(j?.error||"Brain returned no usable response");let z=j.synthesis||j.response||j.result||j;return[z.title,z.recommendation||z.rationale||z.response||z.answer||z.message].filter(Boolean).join(": ")||"ORION received your command."}function speak(t){last=t;if(!t||!window.speechSynthesis)return;let u=new SpeechSynthesisUtterance(t);u.lang="en-ZA";u.rate=.96;u.pitch=.88;u.onstart=()=>voice("ORION SPEAKING");u.onend=()=>voice("VOICE READY");u.onerror=()=>voice("VOICE ERROR");speechSynthesis.cancel();speechSynthesis.speak(u)}async function execute(q){if(busy)return;q=(q||$("command").value).trim();if(!q)return;busy=true;$("run").disabled=true;state("THINKING…");add("YOU",q);add("ORION","Thinking…");try{let r=await brain(q);$("feed").firstElementChild.remove();add("ORION",r);last=r;speak(r);$("command").value="";state("ORION ONLINE")}catch(e){$("feed").firstElementChild.remove();add("ORION","Core error: "+e.message);state("CORE ERROR")}finally{busy=false;$("run").disabled=false}}$("signin").onclick=async()=>{try{let r=await(await cli()).auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)throw r.error;show()}catch(e){$("authmsg").textContent=e.message}};$("run").onclick=()=>execute();$("command").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();execute()}};$("speak").onclick=()=>speak(last||"ORION is online and ready.");$("mic").onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){voice("MIC UNSUPPORTED");return}let r=new R;r.lang="en-ZA";r.continuous=false;r.interimResults=false;r.onstart=()=>{voice("LISTENING");state("LISTENING")};r.onresult=e=>{let t=e.results?.[0]?.[0]?.transcript?.trim();if(t){$("command").value=t;execute(t)}};r.onerror=()=>{voice("MIC ERROR");state("CORE READY")};r.onend=()=>{if(!busy)voice("VOICE READY")};try{r.start()}catch{voice("TAP MIC AGAIN")}};(async()=>{try{let x=await cli();x.auth.onAuthStateChange((ev,s)=>{if(s)show()});let r=await x.auth.getSession();if(r.data.session)show()}catch(e){$("authmsg").textContent=e.message}})()})();
</script></body></html>
